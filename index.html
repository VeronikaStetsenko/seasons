<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seasons</title>
    <link rel="stylesheet" href="main.css">
    <script src="myScript.js"></script>
</head>

<body>
    <header class="header">
        <h1 class="header-h1" id="id-h1">
            summer
        </h1>
    </header>

    <main class="main">
        <div class="container">
            <p class="main-text" id="text">
                Summer is bright and full of adventure. Long sunny days, clear skies, and warm evenings make it the
                perfect season to relax and explore.
            </p>
        </div>


        <div class="container">
            <section class="buttons">

                <button class="btn" onclick="summer()">summer</button>
                <button class="btn" onclick="spring()">spring</button>
                <button class="btn" onclick="autumn()">autumn</button>
                <button class="btn" onclick="winter()">winter</button>

            </section>
        </div>

        <div class="footer"></div>
    </main>

</body>

</html>
